name: Build and Deploy to Docker Hub

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Клонируем репозиторий
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Устанавливаем JDK (для Maven)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Собираем приложение через Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Логинимся в Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Собираем Docker-образ
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/urlshortener:latest .
          docker build -t ${{ secrets.DOCKER_USERNAME }}/urlshortener:${{ github.sha }} .

      # 6. Пушим образы в Docker Hub
      - name: Push Docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/urlshortener:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/urlshortener:${{ github.sha }}

